create_vacation:
  name: Create vacation
  description: >-
    Schedule a holiday on the selected Ariston device. Leave the end date empty
    to clear an existing holiday. Supported on Galevo systems and on Velis Slp
    (Nuos Split) heat pumps.
  fields:
    device_id:
      name: Device
      description: Ariston device on which to create the vacation.
      required: true
      selector:
        device:
          integration: ariston
    end_date:
      name: End date
      description: Date the holiday ends. Leave empty to clear an active holiday.
      example: "2026-08-15"
      selector:
        date:
set_item_by_id:
  name: Set item by id
  description: Ariston device or thermostat property
  fields:
    device_id:
      name: Device
      description: Ariston device on which to set item.
      required: true
      selector:
        device:
          integration: ariston
    item_id:
      name: Device or thermostat property
      description: Ariston device or thermostat property
      required: true
      selector:
        select:
          options:
            - "AutomaticThermoregulation"
            - "DhwMode"
            - "DhwTemp"
            - "PlantMode"
            - "AntilegionellaOnOff"
            - "AntilegionellaTemp"
            - "AntilegionellaFreq"
            - "ZoneComfortTemp"
            - "ZoneEconomyTemp"
            - "ZoneMode"
            - "ZoneDeroga"
            - "VirtTempOffsetHeat"
    zone:
      name: Thermostat zone
      description: Number of the zone. Set 0 if device.
      required: true
      selector:
        number:
          min: 0
          max: 100
    value:
      name: Value
      description: Value of the setting.
      required: true
      example: "1"
      selector:
        text:
